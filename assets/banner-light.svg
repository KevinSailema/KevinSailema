<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f8fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .floating { animation: float 3s ease-in-out infinite; }
      .pulsing { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#gradientBgLight)"/>
  
  <!-- Animated Circles -->
  <circle cx="150" cy="80" r="40" fill="#0969da" opacity="0.2" class="pulsing"/>
  <circle cx="1050" cy="220" r="60" fill="#0969da" opacity="0.15" class="pulsing" style="animation-delay: 0.5s"/>
  
  <!-- Main Title -->
  <text x="600" y="100" font-size="48" font-weight="bold" text-anchor="middle" fill="#0969da" font-family="Arial, sans-serif">
    Kevin Sailema
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="160" font-size="28" text-anchor="middle" fill="#57606a" font-family="Arial, sans-serif">
    Full Stack Developer & Open Source Contributor
  </text>
  
  <!-- Tech Stack Icons -->
  <text x="600" y="230" font-size="16" text-anchor="middle" fill="#0969da" font-family="Arial, sans-serif">
    TypeScript • React • Node.js • .NET • Java • Cloud Architecture
  </text>
  
  <!-- Floating elements -->
  <g class="floating">
    <circle cx="100" cy="250" r="8" fill="#0969da"/>
    <circle cx="120" cy="260" r="5" fill="#54a3ff"/>
    <circle cx="140" cy="250" r="6" fill="#79c0ff"/>
  </g>
  
  <g class="floating" style="animation-delay: 0.3s">
    <circle cx="1100" cy="80" r="8" fill="#0969da"/>
    <circle cx="1080" cy="90" r="5" fill="#54a3ff"/>
    <circle cx="1060" cy="80" r="6" fill="#79c0ff"/>
  </g>
</svg>
